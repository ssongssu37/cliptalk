name: ClipTalk
options:
  bundleIdPrefix: com.sunghun
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: N999F5MRQC
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    PRODUCT_NAME: ClipTalk
  configs:
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      CODE_SIGN_STYLE: Manual

targets:
  ClipTalk:
    type: application
    platform: macOS
    sources:
      - path: ClipTalk
        excludes:
          - "Resources/bin/**"
      - path: ClipTalk/Resources/bin
        type: folder
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: ClipTalk/Info.plist
      properties:
        CFBundleName: ClipTalk
        CFBundleDisplayName: ClipTalk
        CFBundleIdentifier: com.sunghun.ClipTalk
        CFBundleShortVersionString: "0.1.3"
        CFBundleVersion: "4"
        LSMinimumSystemVersion: "13.0"
        NSHighResolutionCapable: YES
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: YES
        NSAppleEventsUsageDescription: "ClipTalk reads the current tab URL from your browser so it can clip the highlighted transcript text from that video."
        NSServices:
          - NSMenuItem:
              default: "Save to ClipTalk"
            NSMessage: saveToClipTalk
            NSPortName: ClipTalk
            NSSendTypes:
              - NSStringPboardType
              - public.plain-text
          - NSMenuItem:
              default: "Download from ClipTalk"
            NSMessage: downloadFromClipTalk
            NSPortName: ClipTalk
            NSSendTypes:
              - NSStringPboardType
              - public.plain-text
              - public.url
    entitlements:
      path: ClipTalk/ClipTalk.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.cs.allow-unsigned-executable-memory: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
